settings:
  interval_minutes: 30          # base poll interval (seats.aero Pro = 1000 calls/day)
  jitter_minutes: 5             # random extra delay each cycle
  max_trip_lookups_per_cycle: 25  # cap on /trips calls (only used with fare_classes/carriers)
  realert_hours: 24             # re-notify same flight after N hours (0 = never, unless cheaper)

# Notification targets (Apprise URLs). ${VARS} are expanded from the environment,
# so keep secrets in .env. You can also put them in NOTIFY_URLS in .env instead.
notify:
  # Gmail (needs an App Password: https://myaccount.google.com/apppasswords)
  - "mailtos://${GMAIL_USER}:${GMAIL_APP_PASSWORD}@gmail.com?to=${ALERT_EMAIL}"
  # SMS via Twilio:
  # - "twilio://${TWILIO_SID}:${TWILIO_TOKEN}@${TWILIO_FROM}/${MY_PHONE}"
  # Free phone push via ntfy app (subscribe to the topic in the ntfy app):
  # - "ntfys://ntfy.sh/${NTFY_TOPIC}"

watches:
  # Polaris saver (I bucket) SFO -> Tokyo, any date in the window
  - name: SFO-TYO Polaris saver
    origin: SFO
    destination: NRT,HND
    start_date: 2027-03-01
    end_date: 2027-04-15
    cabins: [business]
    fare_classes: saver          # "saver" = X/O/I per cabin, or list e.g. [I]
    min_seats: 2
    carriers: [UA]               # only United-operated metal

  # Economy under 30k miles, nonstop only
  - name: EWR-LHR cheap economy
    origin: EWR,JFK
    destination: LHR
    start_date: 2027-01-10
    end_date: 2027-02-28
    cabins: [economy]
    max_miles: 30000
    direct_only: true
